site_name: Neojax
site_description: The documentation for the Neojax python library.
site_author: Paul Gekeler
site_url: https://paulgekeler.github.io/neojax/

repo_name: paulgekeler/neojax
repo_url: https://github.com/paulgekeler/neojax

strict: true

extra_css:
  - _assets/custom_css.css

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github  

  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
    - header.autohide

plugins:
  - search
  - hippogriffe:
      extra_public_objects:
        - numpy.dtype
        - equinox.if_array
        - jax.ShapeDtypeStruct
        - jax.extend.core.ClosedJaxpr
        - jax.Device
        - jax.sharding.Sharding
  - mkdocstrings:
      handlers:
        python:
          paths: [.] # Allow mkdocstrings to find the neojax package
          options:
            extensions:
            - griffe_pydantic:
              schema: true
            docstring_style: google
            docstring_options:
              returns_multiple_items: false # Treat multiple return values as one
            force_inspection: true
            heading_level: 4
            inherited_members: false
            members_order: source
            show_bases: false
            show_if_no_docstring: true
            show_overloads: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters:
              - "!^_[^_]"  # Hides protected attrs/methods (e.g., _local_var)
              - "!^__[^c]" # Blocks all dunder attrs followed by c...

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
  - toc:
      permalink: "¤"
      toc_depth: 4
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Neojax vs Neuraloperator Benchmarks: benchmark_neojax_vs_neuraloperator.md
  - API Reference:
      - Models: api/models.md
      - Components: api/nn.md
      - Tensors: api/tensors.md
      - Metrics: api/metrics.md
      - Utilities: api/utils.md
      - Training: api/training.md
      - Data:
        - Datasets: api/datasets.md
        - Schemas: api/schemas.md
        - Processor: api/processor.md
        - Normalizers: api/normalizers.md
        - Scales: api/scales.md
        - Data Bundle: api/bundle.md
        - Data Downloading: api/download.md
        - Data Generation: api/data_generation.md
      - PDE Benchmark:
        - Benchmarking: api/benchmark.md
        - Benchmark Config: api/benchmark_config.md
        - Evaluators: api/evaluators.md
  - Examples:
    - Basic Usage: examples/01_basics.md
    - Training FNO: examples/02_fno_burgers.md
    - Data Pipeline: examples/03_data_pipeline.md
    - Benchmarking: examples/04_benchmarking_pipeline.md
    - Advanced Training: examples/05_advanced_training.md
