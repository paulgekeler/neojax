site_name: neojax
site_description: Neural Operators in JAX
site_url: https://paulgekeler.github.io/neojax/

repo_name: paulgekeler/neojax
repo_url: https://github.com/paulgekeler/neojax

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.] # Allow mkdocstrings to find the neojax package
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_type_annotations: true
  - mkdocs-jupyter:
      include: ["docs/examples/*.ipynb"]
      execute: false
      include_source: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]

nav:
  - Home: index.md
  - API Reference:
      - Models: api/models.md
      - Components: api/nn.md
  - Examples:
    - Basic Usage: examples/01_basics.ipynb
    - Training FNO: examples/02_fno_burgers.ipynb
